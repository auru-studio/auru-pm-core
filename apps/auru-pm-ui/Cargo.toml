[package]
name = "auru-pm-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Standalone GPUI desktop client for Auru PM"
license = "MIT OR Apache-2.0"
repository = "https://github.com/auru-studio/auru-pm-core"
readme = "../../README.md"
publish = false

[workspace]
resolver = "2"

[dependencies]
async-channel = "2"
auru-pm = { path = "../../crates/auru-pm" }
auru-pm-client = { path = "../../crates/auru-pm-client" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-mcp = "0.1.0"
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
tokio = { version = "1", features = ["net", "rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
future-incompatible = "warn"
nonstandard-style = "deny"
unsafe-code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
tempfile = "3"
