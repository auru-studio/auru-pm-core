[workspace]
resolver = "2"
members = [
    "crates/auru-pm",
    "crates/auru-pm-client",
    "crates/auru-pm-ffi",
    "crates/auru-pm-kernel",
    "crates/auru-pm-protocol",
    "crates/auru-pm-server",
]
exclude = ["apps/auru-pm-ui"]
default-members = [
    "crates/auru-pm",
    "crates/auru-pm-client",
    "crates/auru-pm-ffi",
    "crates/auru-pm-kernel",
    "crates/auru-pm-protocol",
    "crates/auru-pm-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/auru-studio/auru-pm-core"

[workspace.dependencies]
auru-pm = { path = "crates/auru-pm" }
auru-pm-client = { path = "crates/auru-pm-client" }
auru-pm-ffi = { path = "crates/auru-pm-ffi" }
auru-pm-kernel = { path = "crates/auru-pm-kernel" }
auru-pm-protocol = { path = "crates/auru-pm-protocol" }
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
keyring = { version = "3.6.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard-style = "deny"
unsafe-code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Size-first profile for the browser binding.
#
# A dashboard downloads this before it can render anything, so bytes matter more
# than the last few percent of throughput — the kernel's hot paths are hashing
# and parsing, which are dominated by the work itself rather than by codegen.
# `panic = "abort"` is deliberate: every fallible entry point already returns a
# Result, so a panic here is a bug, and carrying unwinding tables to describe
# one costs every user of the page.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
