name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The browser SDK compiles auru-pm-kernel and nothing else. If a filesystem,
  # socket, or keychain dependency reaches the kernel, this job fails — which is
  # the whole reason the kernel is a separate crate rather than a feature flag.
  portable-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p auru-pm-kernel --target wasm32-unknown-unknown --locked

  # Every SDK verifies the same canonical-encoding vectors. A vector that passes
  # in one language and fails in another is exactly what the spec exists to catch.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p auru-pm --test spec_vectors --locked
      - run: npx --yes @redocly/cli@latest lint spec/openapi.yaml

  # Both bindings must reproduce the published vectors, and agree with each
  # other. A commit whose id an implementation cannot reproduce is rejected by
  # every provider, so this is the check that keeps an SDK honest.
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Pinned to the wasm-bindgen crate version in Cargo.lock; a CLI that
      # disagrees with the crate produces a module that will not load.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126

      - name: Build the browser binding
        run: |
          cargo build -p auru-pm-ffi --features wasm \
            --target wasm32-unknown-unknown --release --locked
          wasm-bindgen --target nodejs --out-dir dist/wasm \
            target/wasm32-unknown-unknown/release/auru_pm_ffi.wasm
      - name: Verify the browser binding against the vectors
        run: node spec/conformance/verify-vectors.mjs dist/wasm/auru_pm_ffi.js

      - name: Build the Node binding
        run: |
          cargo build -p auru-pm-ffi --features node --release --locked
          cp target/release/libauru_pm_ffi.so dist/auru_pm_ffi.node
      - name: Verify the Node binding against the vectors
        run: node spec/conformance/verify-vectors.mjs dist/auru_pm_ffi.node

  # The TypeScript SDK, including its end-to-end tests: those start a real
  # auru-pm-server and push commits through it, because mocked HTTP only proves
  # the client agrees with the test's idea of the protocol.
  #
  # `typecheck` is a separate step from `test` on purpose — vitest does not
  # typecheck, so a type error can otherwise sail through a green test run.
  sdk-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - run: npm ci
      - run: npm run typecheck
      # `build` compiles the wasm binding first, so this covers both.
      - run: npm run build
      - run: npm run build:native
      - run: npm run test:only
      # The published tarball must carry the wasm binding; without it the
      # package installs and then cannot compute a commit id.
      - run: npm pack --dry-run 2>&1 | grep -q 'wasm/auru_pm_ffi_bg.wasm'

  # One runner per platform, because a native addon has to be linked where it
  # will run. Every artifact is checked against the vectors before it is kept:
  # a binary that cannot reproduce a commit id is worse than a missing one,
  # since the fallback would have worked.
  native-addons:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runs-on: macos-14
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runs-on: macos-13
          - platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - platform: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
          - platform: linux-x64-musl
            target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
            musl: true
          - platform: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # A glibc binary will not load on Alpine; the musl target needs its own
      # linker, and the failure without it is an opaque link error.
      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and package the addon
        working-directory: sdk/typescript
        run: node scripts/prepare-platform-package.mjs ${{ matrix.platform }} --build
      # A musl addon cannot be loaded by the glibc Node on this runner, so it is
      # verified where it can actually run rather than skipped.
      - name: Verify it reproduces the vectors
        if: '!matrix.musl'
        working-directory: sdk/typescript
        shell: bash
        run: |
          node ../../spec/conformance/verify-vectors.mjs \
            "platforms/${{ matrix.platform }}/auru-pm-${{ matrix.platform }}.node"
      - name: Verify the musl addon inside Alpine
        if: matrix.musl
        run: |
          docker run --rm -v "$PWD":/work -w /work node:22-alpine \
            node spec/conformance/verify-vectors.mjs \
              "sdk/typescript/platforms/linux-x64-musl/auru-pm-linux-x64-musl.node"
      - uses: actions/upload-artifact@v4
        with:
          name: auru-pm-${{ matrix.platform }}
          path: sdk/typescript/platforms/${{ matrix.platform }}

  # The Java SDK is pure Java — it implements RFC 8785 and BLAKE3 itself rather
  # than binding to the Rust kernel — so the conformance vectors are the only
  # thing standing between it and a commit id no provider accepts.
  sdk-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The transport tests run against a real auru-pm-server.
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: ./gradlew build --no-daemon
      # The library claims zero runtime dependencies; this runs a consumer with
      # nothing but auru-pm.jar on the classpath, which is the only way to know.
      - run: ./consumer-check/run.sh
      # Fails here rather than at upload if the POM or artifact set is missing
      # something Maven Central insists on.
      - run: ./gradlew verifyPublishable --no-daemon

  # The C++ SDK is pure C++ — it implements RFC 8785, BLAKE3 and SHA-256 itself
  # rather than binding to the Rust kernel — so the conformance vectors are the
  # only thing standing between it and a commit id no provider accepts.
  sdk-cpp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            compiler: gcc
          - runs-on: ubuntu-latest
            compiler: clang
          - runs-on: macos-14
            compiler: clang
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        working-directory: sdk/cpp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: Select the compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc"  >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang"    >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      # Warnings are errors in this build, so both compilers have to be clean —
      # they disagree often enough that checking one proves little.
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      # The optional adapter has to keep compiling even though nothing depends
      # on it.
      - run: cmake -S . -B build-curl -DAURU_PM_WITH_CURL=ON && cmake --build build-curl
      # The no-dependency claim, checked by giving it nothing else.
      - run: ./consumer-check/run.sh

  # Conan is how this library is distributed, so the recipe is tested rather
  # than merely present. `conan create` runs test_package, which derives a
  # commit id from the packaged library and compares it against the published
  # vector — a package that built but encodes differently fails here.
  sdk-cpp-conan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/cpp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "conan>=2.0,<3"
      - run: conan profile detect --force
      - name: Package with the default options
        run: conan create . --build=missing
      # The optional adapter has a real dependency, and its install rules are a
      # separate code path from the core's.
      - name: Package with the libcurl adapter
        run: conan create . -o "&:with_curl=True" --build=missing

  # The Swift SDK is pure Swift — it implements RFC 8785, BLAKE3 and SHA-256
  # itself — so the conformance vectors are the only thing standing between it
  # and a commit id no provider accepts.
  sdk-swift:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-14
          - runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        working-directory: sdk/swift
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift on Linux
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: swift build
      - run: swift test
      # Building the library proves it compiles; this proves it is usable as a
      # dependency, through its public API only.
      - run: ./consumer-check/run.sh

  # The C header is generated from capi.rs and checked in. A hand-written one
  # would drift silently, and the symptom would be memory corruption rather than
  # a compile error — so regeneration must produce no diff.
  capi-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - run: |
          cbindgen --config crates/auru-pm-ffi/cbindgen.toml \
            --crate auru-pm-ffi --output /tmp/auru_pm.h 2>/dev/null
          diff -u crates/auru-pm-ffi/include/auru_pm.h /tmp/auru_pm.h

  # The compute kernel on Apple platforms. `swift test` runs it on the macOS
  # slice, which is the only place a wrong hash surfaces as a test failure
  # rather than as a crash in a simulator.
  kernel-apple:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: ./sdk/swift-kernel/scripts/build-xcframework.sh
      - run: swift test --package-path sdk/swift-kernel
      # Every slice a device or simulator would actually load.
      - run: |
          for slice in ios-arm64 ios-arm64-simulator macos-arm64; do
            test -f "sdk/swift-kernel/Artifacts/AuruPMKernelFFI.xcframework/$slice/libauru_pm_ffi.a" \
              || { echo "missing slice $slice" >&2; exit 1; }
          done

  # The compute kernel on Android. The JNI glue is verified on the host JVM,
  # where a marshalling bug is a test failure; cross-compiling only changes
  # which linker produced the library.
  kernel-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Verify the JNI binding on the host JVM
        run: ./gradlew test --tests 'studio.auru.pm.KernelTest' --no-daemon
        working-directory: sdk/java
      - name: Cross-compile the Android libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: ./sdk/java-kernel-build.sh
      - name: Check both ABIs are present and export the JNI symbols
        run: |
          for abi in arm64-v8a x86_64; do
            so="sdk/java/native/jniLibs/$abi/libauru_pm_ffi.so"
            test -f "$so" || { echo "missing $abi" >&2; exit 1; }
            count=$(llvm-nm -D --defined-only "$so" | grep -c Java_studio_auru_pm_Kernel)
            test "$count" -eq 12 || { echo "$abi exports $count JNI symbols, expected 12" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: auru-pm-jnilibs
          path: sdk/java/native/jniLibs

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/auru-pm-ui
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI system libraries
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libasound2-dev
          libfontconfig-dev
          libglib2.0-dev
          libssl-dev
          libwayland-dev
          libx11-xcb-dev
          libxkbcommon-x11-dev
          libzstd-dev
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/auru-pm-ui -> target
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
