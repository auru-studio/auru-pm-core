name: Release @auru/pm

# Publishing is tag-triggered and manual by design: it is the one action in this
# repository that cannot be undone, since a published npm version can be
# deprecated but never replaced.
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack everything without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Every native addon, built where it will run and checked against the
  # published vectors before it is allowed near npm.
  addons:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runs-on: macos-14
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runs-on: macos-13
          - platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - platform: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
          - platform: linux-x64-musl
            target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
            musl: true
          - platform: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and package the addon
        working-directory: sdk/typescript
        run: node scripts/prepare-platform-package.mjs ${{ matrix.platform }} --build
      - name: Verify it reproduces the vectors
        if: '!matrix.musl'
        working-directory: sdk/typescript
        shell: bash
        run: |
          node ../../spec/conformance/verify-vectors.mjs \
            "platforms/${{ matrix.platform }}/auru-pm-${{ matrix.platform }}.node"
      - name: Verify the musl addon inside Alpine
        if: matrix.musl
        run: |
          docker run --rm -v "$PWD":/work -w /work node:22-alpine \
            node spec/conformance/verify-vectors.mjs \
              "sdk/typescript/platforms/linux-x64-musl/auru-pm-linux-x64-musl.node"
      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.platform }}
          path: sdk/typescript/platforms/${{ matrix.platform }}

  publish:
    needs: addons
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: the registry records which workflow and commit produced
      # each tarball, so a consumer can check the package against this repo.
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126

      - uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          path: sdk/typescript/platforms
      - name: Flatten the downloaded addons
        run: |
          for dir in platforms/addon-*; do
            mv "$dir" "platforms/$(basename "$dir" | sed 's/^addon-//')"
          done
          ls -la platforms/*

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:native
      - run: npm run test:only

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${{ github.ref_name }}"
          tagged="${tagged#sdk-v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $tagged does not match package version $declared" >&2
            exit 1
          fi

      # Platform packages first: the main package names them in
      # optionalDependencies, and npm resolves those at install time.
      - name: Publish the platform packages
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in platforms/*/; do
            (cd "$dir" && npm publish --access public --provenance)
          done
      - name: Publish @auru/pm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Pack everything instead (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          for dir in platforms/*/; do (cd "$dir" && npm pack --dry-run); done
          npm pack --dry-run
