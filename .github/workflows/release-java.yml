name: Release studio.auru:auru-pm

# Tag-triggered and manual, like the npm release: publishing to Maven Central
# cannot be undone. A version can be deprecated but never replaced.
on:
  push:
    tags: ["java-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and stage everything without uploading
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2

      # The full suite, including the conformance vectors and the end-to-end
      # tests against a real auru-pm-server. A library that cannot reproduce a
      # commit id is worse than no library, because the fallback is obvious.
      - run: ./gradlew build --no-daemon

      # The zero-dependency claim, checked by giving it nothing else.
      - run: ./consumer-check/run.sh

      - name: Check the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#java-v}"
          declared="$(./gradlew --no-daemon --quiet properties | awk '/^version:/ {print $2}')"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $tagged does not match project version $declared" >&2
            exit 1
          fi

      - name: Stage and sign the artifacts
        env:
          SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew verifyPublishable --no-daemon

      - name: Bundle the staging repository
        run: |
          cd build/staging-repository
          zip -r ../central-bundle.zip .
          unzip -l ../central-bundle.zip | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: maven-central-bundle
          path: sdk/java/build/central-bundle.zip

      - name: Upload to the Central Portal
        if: ${{ !inputs.dry_run }}
        env:
          CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          # Uploaded to the portal rather than auto-released: the deployment
          # lands VALIDATED and a person publishes it, so a mistake caught here
          # costs a click instead of a permanent version.
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CENTRAL_TOKEN" \
            --form bundle=@build/central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED"
