name: Release auru-pm-server image

# Every push to main builds and publishes an image tagged by commit, so the
# deployment repository can pin a digest rather than a moving tag. A
# `server-v*` tag adds the version as a tag of its own.
on:
  push:
    branches: [main]
    tags: ["server-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/auru-pm-server

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The app replaces its bundled plugin list with whatever this server
      # serves, so the served copy must be the bundled one — never older, and
      # never empty.
      - name: Check the deployed registry matches the bundled one
        run: |
          cmp crates/auru-pm/data/plugins.json deploy/registry/plugins.json
          for document in deploy/registry/*.json; do
            jq -e 'type == "object"' "$document" > /dev/null
          done

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=match,pattern=server-v(.*),group=1
            type=ref,event=branch

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is what auru-infra pins; a tag can be moved, a digest cannot.
      - name: Record the digest
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          {
            echo "## auru-pm-server image"
            echo
            echo '```'
            echo "${image}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Tags: ${{ steps.meta.outputs.tags }}" | tr '\n' ' '
            echo
          } >> "$GITHUB_STEP_SUMMARY"
