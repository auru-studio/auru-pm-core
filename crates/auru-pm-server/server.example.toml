# Auru PM server configuration, schema version 1.
version = 1
provider_id = "studio-pm"
listen = "127.0.0.1:4242"
public_base_url = "https://pm.example.com"
data_dir = "./auru-pm-server-data"
requests_per_minute = 600

# Browser origins allowed to call this server cross-origin. Empty by default,
# which installs no CORS layer at all — leave it that way unless you actually
# serve a browser dashboard. Never `*`: the dashboard authenticates with a
# bearer token, and this list is what stops another site from driving requests
# here from a signed-in user's browser. Plain http is accepted only on loopback.
# allowed_origins = ["https://dashboard.example.com"]

# TLS terminated by this server rather than by the proxy in front of it. Leave
# it out for a deployment: the reverse proxy owns the certificate, which is what
# public_base_url above describes. Uncomment one of these for local development
# against a phone or emulator, where there is no proxy and Android refuses
# cleartext HTTP outright.
#
# A self-signed authority minted into data_dir. The leaf is reissued on every
# start so it always covers the addresses this run listens on; the authority
# is not, because it is the file you told the device to trust. Loopback,
# 10.0.2.2 (the Android emulator's host alias) and — for a wildcard listener —
# this machine's own interface addresses are covered without configuration.
# [tls]
# mode = "development_certificate"
# subject_alt_names = ["studio.local"]
#
# Or a chain issued elsewhere: mkcert, an internal CA, a staging certificate.
# Leaf first in the certificate file, then any intermediates.
# [tls]
# mode = "files"
# certificate = "/etc/auru-pm/fullchain.pem"
# private_key = "/etc/auru-pm/privkey.pem"

[authentication]
mode = "oauth"
# The exact issuer published by your OAuth 2.0 / OpenID Connect provider.
# For Clerk this is the Frontend API URL for the instance.
issuer = "https://identity.example.com"
# The audience your provider puts in access tokens for this PM server.
audience = "auru-pm"
# Register this as a public/native client: it must not have a client secret.
desktop_client_id = "auru-pm-desktop"
# `openid` works with providers that do not support application-defined scopes.
required_scope = "openid"
# Register this exact redirect URI with the identity provider.
redirect_uri = "http://127.0.0.1:43827/oauth/callback"
flows = ["authorization_code_pkce"]

# A browser dashboard needs its own registration: an identity provider's
# redirect allow-list is per client, and a loopback callback and an https
# single-page callback cannot share one entry without widening it past what
# either app needs. Requires allowed_origins above.
# [authentication.browser_client]
# client_id = "auru-pm-dashboard"
# redirect_uri = "https://dashboard.example.com/oauth/callback"
# flows = ["authorization_code_pkce"]

# Required only when enabling OAuth over a data directory created by an older
# unauthenticated server. Set it to the provider subject that owns all existing
# projects, start once, then it may remain for auditability.
# legacy_owner_subject = "user_..."

[authentication.validation]
# Access tokens are JWTs verified from the issuer's discovered JWKS.
strategy = "jwt"
