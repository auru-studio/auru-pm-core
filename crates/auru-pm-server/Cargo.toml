[package]
name = "auru-pm-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Development HTTP server for the auru-pm-v1 protocol"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = false

[dependencies]
atomic-write-file = "0.3"
auru-pm.workspace = true
auru-pm-protocol.workspace = true
async-trait.workspace = true
axum = "0.7"
# TLS termination for local development. `axum::serve` has no TLS story, and
# the no-provider feature keeps rustls on the same `ring` backend reqwest
# already links rather than adding a second crypto library to the build.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
if-addrs = "0.15"
jsonwebtoken = "9"
rcgen = { version = "=0.14.7", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Already in the tree behind rustls; a direct dependency only so the development
# authority can be fingerprinted for the startup banner.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors", "decompression-gzip"] }
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
