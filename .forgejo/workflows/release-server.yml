# Fallback image pipeline on Forgejo (self-hosted runners + Forgejo's built-in
# container registry). Mirrors .github/workflows/docker.yml; either registry
# works with auru-infra — pick one in apps/overlays/prod/kustomization.yaml.
#
# Repo secrets: none required. The workflow's automatic token can push
# packages to the repository owner's namespace. Set REGISTRY_TOKEN (a Forgejo
# access token with package:write) only if your instance restricts that.
name: Server image (Forgejo)

on:
  push:
    branches: ["**"]
    tags: ["server-v*"]
  workflow_dispatch:

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: image-builder
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: auru-pm-server
            context: .
    env:
      REGISTRY: ${{ vars.REGISTRY_HOST || 'git.pottsnpans.house' }}
      # Build with BuildKit (the Docker CLI step installs the buildx plugin;
      # needed for RUN --mount cache mounts and # syntax= Dockerfiles).
      DOCKER_BUILDKIT: "1"
      # CPU architecture of the k3s node the image will run on. A native runner
      # is fastest; on any other arch the build runs under QEMU (binfmt is
      # registered below), which works but is several times slower.
      TARGET_ARCH: ${{ vars.TARGET_ARCH || 'arm64' }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Hosted plugin registry must match the bundled one
        run: cmp crates/auru-pm/data/plugins.json deploy/registry/plugins.json

      - name: Docker CLI (job runs in node:20-bookworm; the daemon is the runner host's)
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in x86_64) a=x86_64; b=amd64 ;; aarch64) a=aarch64; b=arm64 ;; *) echo "unsupported arch $arch"; exit 1 ;; esac
          if ! command -v docker >/dev/null; then
            curl -fsSL "https://download.docker.com/linux/static/stable/${a}/docker-27.5.1.tgz" \
              | tar -xz --strip-components=1 -C /usr/local/bin docker/docker
          fi
          # The static CLI ships without buildx, and Docker 27 needs the plugin
          # for any BuildKit build (RUN --mount, # syntax= directives).
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-buildx \
            "https://github.com/docker/buildx/releases/download/v0.37.1/buildx-v0.37.1.linux-${b}"
          chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
          docker version --format 'client {{.Client.Version}} / daemon {{.Server.Version}}'
          docker buildx version
          if [[ "$b" != "$TARGET_ARCH" ]]; then
            echo "runner is $b, target is $TARGET_ARCH: registering QEMU binfmt handlers (emulated build, expect it to be slow)"
            docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2 --install "$TARGET_ARCH" >/dev/null
          fi

      - name: Log in to the Forgejo registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ vars.REGISTRY_USER || github.actor }}" --password-stdin

      - name: Build and push
        id: push
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')"
          image="$REGISTRY/$owner/${{ matrix.image }}"
          sha_tag="sha-${{ github.sha }}"
          tags=(-t "$image:$sha_tag")
          case "${{ github.ref }}" in
            "refs/heads/${{ github.event.repository.default_branch }}") tags+=(-t "$image:latest") ;;
            refs/tags/server-v*) tags+=(-t "$image:${GITHUB_REF_NAME#server-v}") ;;
          esac
          docker buildx build --pull --platform "linux/$TARGET_ARCH" --load "${tags[@]}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            "${{ matrix.context }}"
          for t in "${tags[@]}"; do [[ "$t" == -t ]] && continue; docker push "$t"; done
          built_arch="$(docker inspect --format '{{.Architecture}}' "$image:$sha_tag")"
          [[ "$built_arch" == "$TARGET_ARCH" ]] || { echo "built $built_arch, expected $TARGET_ARCH" >&2; exit 1; }
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$sha_tag" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$image@$digest ($built_arch)" >> "$GITHUB_STEP_SUMMARY"
          echo "pushed $image@$digest ($built_arch)"
